<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work &amp; Energy Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: navy instrument bar on top; each screen = play area + graphs | control panel | question panel (PhET-style lab bench). */
:root{
  --navy:#1b2f4e; --navy-2:#2b4874; --navy-soft:#e7edf6;
  --ink:#16202d; --muted:#4f5c6f; --line:#d3dce8; --panel:#ffffff; --bg:#edf2f7;
  --amber:#e08a00; --amber-ink:#8a5300; --amber-soft:#fff3dc;
  --ke:#1f9d55; --pe:#2a6fdb; --th:#e4572e; --tot:#5b3fa8;
  --good:#17804a; --good-soft:#e5f6ec; --bad:#b93b0e; --bad-soft:#fdece5;
  --font-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display:'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f2b544;outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:#fff;text-align:left}
.brand svg{flex:none}
.brand b{font-family:var(--font-display);font-size:18px;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:#b9c8de;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:0;border-radius:9px;background:transparent;color:#d5e0ef;padding:6px 10px;font-size:13.5px;font-weight:500;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab[aria-selected="true"]{background:#fff;color:var(--navy)}
.tab .num{font-family:var(--font-mono);font-size:11px;opacity:.75}
.tab .pdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
.tab[aria-selected="true"] .pdot{background:#c9d4e3}
.tab .pdot.part{background:#f2b544}.tab .pdot.full{background:#4cc27f}
.resbtn{flex:none;border:1.5px solid #f2b544;background:transparent;color:#fff;border-radius:9px;padding:6px 12px;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.resbtn:hover{background:#f2b544;color:var(--navy)}
.resbtn .score{font-family:var(--font-mono);font-size:12.5px}

/* ---------- home ---------- */
.home{max-width:1180px;margin:0 auto;padding-block:26px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:stretch}
.hero h1{font-family:var(--font-display);font-size:clamp(30px,4vw,44px);line-height:1.05;margin:0 0 8px;color:var(--navy);text-wrap:balance}
.hero .kick{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-ink)}
.hero p{margin:0 0 10px;max-width:62ch}
.howto{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.howto h2{font-size:14px;margin:0 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.08em}
.howto ol{margin:0;padding-left:20px;display:grid;gap:5px}
.namebox{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.namebox label{font-weight:600}
.namebox input{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.legend-energy{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.legend-energy span{display:inline-flex;align-items:center;gap:6px}
.legend-energy i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:22px}
.card{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s, box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(27,47,78,.12)}
.card .art{background:linear-gradient(#d9ecfb,#f4f9ff);height:120px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .sec{font-family:var(--font-mono);font-size:12px;color:var(--amber-ink);font-weight:600}
.card h3{margin:0;font-family:var(--font-display);font-size:19px;color:var(--navy)}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.card .prog{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:9px;background:#e3e9f1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:9px}
.extbadge{position:absolute;top:10px;right:10px;background:var(--amber-soft);color:var(--amber-ink);border:1px solid #f0c77a;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px}

/* ---------- screen layout ---------- */
.screen{display:grid;grid-template-columns:minmax(0,1fr) 262px 360px;gap:14px;align-items:start;padding-block:14px 30px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1640px;margin:0 auto}
.stage{min-width:0;display:flex;flex-direction:column;gap:12px}
.stagehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stagehead h2{margin:0;font-family:var(--font-display);font-size:22px;color:var(--navy)}
.stagehead .sec{font-family:var(--font-mono);font-size:12.5px;color:var(--amber-ink);font-weight:600}
.stagehead p{margin:0;color:var(--muted);font-size:13.5px;flex-basis:100%}
.play{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#e6f3fc;touch-action:none}
.play canvas{display:block;width:100%}
.pc{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;border-top:1px solid var(--line);padding:6px 8px}
.pc button{border:0;background:transparent;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:var(--navy)}
.pc button:hover{background:var(--navy-soft)}
.pc button.big{width:44px;height:44px;background:var(--navy);color:#fff}
.pc button.big:hover{background:var(--navy-2)}
.pc .spd{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:4px}
.pc .spd button{width:auto;height:28px;border-radius:0;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pc .spd button[aria-pressed="true"]{background:var(--navy);color:#fff}
.graphs{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;min-width:0}
.gcard canvas{display:block;width:100%;height:220px}

/* ---------- control panel ---------- */
.ctrl{display:flex;flex-direction:column;gap:10px;min-width:0}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px}
.box h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sl{display:flex;flex-direction:column;gap:3px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px}
.sl .top label{font-weight:600}
.sl .val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;background:var(--navy-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.sl .row{display:flex;align-items:center;gap:4px}
.sl .row button{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:700;color:var(--navy);line-height:1}
.sl .row button:hover{background:var(--navy-soft)}
.sl.off{opacity:.45}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--navy) var(--fill,50%),#d3dce8 var(--fill,50%))}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:#d3dce8}
input[type=range]::-moz-range-progress{height:5px;border-radius:9px;background:var(--navy)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;border-radius:5px;background:var(--amber);border:2px solid #fff;box-shadow:0 0 0 1px #b56e00;margin-top:-9.5px}
input[type=range]::-moz-range-thumb{width:12px;height:22px;border-radius:5px;background:var(--amber);border:2px solid #fff;box-shadow:0 0 0 1px #b56e00}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg.cols2 button{flex:1 1 45%}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--navy)}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions button,.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:9px;padding:7px 8px;font-weight:600;font-size:13.5px}
.actions button:hover,.btn:hover{background:var(--navy-soft)}
.actions button:disabled,.btn:disabled{opacity:.4;cursor:not-allowed;background:#fff}
.btn.solid{background:var(--navy);color:#fff}
.btn.solid:hover{background:var(--navy-2)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1c1300}
.btn.amber:hover{background:#c97b00}
.resetall{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:2px 4px}
.resetall span{font-size:12.5px;color:var(--muted)}
.resetall button{width:42px;height:42px;border-radius:50%;border:0;background:#f08c00;color:#fff;display:grid;place-items:center;box-shadow:0 2px 0 #b86500}
.resetall button:hover{background:#d97c00}
.readout{display:grid;grid-template-columns:auto auto;gap:3px 10px;font-size:13.5px;align-items:baseline}
.readout dt{color:var(--muted)}
.readout dd{margin:0;text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}
.runs{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.runs table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.runs th{position:sticky;top:0;background:#f4f7fb;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.runs td{padding:3px 6px;text-align:right;border-bottom:1px solid #edf1f6;font-family:var(--font-mono)}
.runs th:first-child,.runs td:first-child{text-align:left}
.note{font-size:12.5px;color:var(--muted);margin:0}
.devgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.devgrid button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 6px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;line-height:1.2}
.devgrid button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}

/* ---------- question panel ---------- */
.qpanel{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);max-height:calc(100vh - 86px);overflow:auto}
.qhead{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:#f8fafd;border-radius:14px 14px 0 0}
.qhead .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qhead h3{margin:0;font-family:var(--font-display);font-size:17px;color:var(--navy)}
.qhead .cnt{font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}
.qdots{display:flex;gap:5px;flex-wrap:wrap}
.qdot{width:28px;height:28px;border-radius:50%;border:1.5px solid #b8c4d4;background:#fff;font-size:12px;font-weight:700;color:var(--muted);display:grid;place-items:center;padding:0}
.qdot[aria-current="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;color:var(--navy)}
.qdot.first{background:var(--good);border-color:var(--good);color:#fff}
.qdot.later{background:#8fd3ad;border-color:#5fb887;color:#0d3d22}
.qdot.shown{background:#e9edf3;border-color:#9aa6b6;color:#6b7686;text-decoration:line-through}
.qdot.tried{border-color:var(--amber)}
.qbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--navy-soft);color:var(--navy)}
.tag.sim{background:var(--amber-soft);color:var(--amber-ink)}
.tag.ext{background:#fde7d9;color:#93330b}
.qprompt{font-size:15px;line-height:1.5}
.qprompt b{color:var(--navy)}
.qfig{border:1px solid var(--line);border-radius:10px;padding:6px;background:#fcfdff}
.qfig svg{display:block;width:100%;height:auto}
.setupbtn{align-self:flex-start;display:inline-flex;gap:7px;align-items:center;border:1.5px dashed var(--amber);background:var(--amber-soft);color:var(--amber-ink);border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px}
.setupbtn:hover{border-style:solid}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ansrow input{width:150px;border:1.5px solid #b8c4d4;border-radius:9px;padding:8px 10px;font-family:var(--font-mono);font-size:15px}
.ansrow input:focus{border-color:var(--navy)}
.ansrow .unit{font-weight:600;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff;text-align:left;font-size:14px;line-height:1.4}
.choice:hover{border-color:#9fb0c6}
.choice .let{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid #9fb0c6;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.choice[aria-checked="true"]{border-color:var(--navy);background:var(--navy-soft)}
.choice[aria-checked="true"] .let{background:var(--navy);border-color:var(--navy);color:#fff}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .let{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.fb.good{background:var(--good-soft);border:1px solid #9fd8b8}
.fb.bad{background:var(--bad-soft);border:1px solid #f1b49c}
.fb.info{background:#f2f5fa;border:1px solid var(--line)}
.fb b.h{display:block;margin-bottom:2px}
.fb.good b.h{color:var(--good)} .fb.bad b.h{color:var(--bad)} .fb.info b.h{color:var(--navy)}
.linkbtn{border:0;background:none;color:var(--navy);text-decoration:underline;padding:0;font-size:13px}
.tries{font-size:12.5px;color:var(--muted)}
.qdone{padding:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,25,40,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--font-display);color:var(--navy)}
.sheet .x{margin-left:auto;border:0;background:var(--navy-soft);border-radius:50%;width:34px;height:34px;font-size:18px;color:var(--navy)}
.restable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.restable th,.restable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.restable th:first-child,.restable td:first-child{text-align:left}
.restable tfoot td{font-weight:700;border-top:2px solid var(--navy)}
.bigscore{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.bigscore b{font-family:var(--font-display);font-size:40px;color:var(--navy);line-height:1}
.bigscore span{color:var(--muted)}
.copyarea{width:100%;min-height:150px;font-family:var(--font-mono);font-size:12.5px;border:1px solid var(--line);border-radius:10px;padding:8px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;z-index:60;font-size:14px}

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .screen{grid-template-columns:minmax(0,1fr) 262px}
  .qpanel{grid-column:1 / -1;position:static;max-height:none}
}
@media (max-width:800px){
  .screen{grid-template-columns:minmax(0,1fr)}
  .graphs{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .tabs{order:3;flex-basis:100%}
  .tabs .tab .lbl{display:none}
  .tabs .tab{padding:6px 8px}
  .gcard canvas{height:200px}
}
@media (max-height:800px) and (min-width:801px){ .gcard canvas{height:196px} }
@media (prefers-reduced-motion:reduce){ .card{transition:none} .card:hover{transform:none} }

</style>
</head>
<body>
<main id="main"></main>
<script>
'use strict';
/* ================= core utilities ================= */
const G = 10;                       // g = 10 N/kg, as in the course
const COL = {
  navy:'#1b2f4e', navy2:'#2b4874', ink:'#16202d', muted:'#4f5c6f', line:'#d3dce8', grid:'#e3e9f1',
  amber:'#e08a00', amberInk:'#8a5300', ke:'#1f9d55', pe:'#2a6fdb', th:'#e4572e', tot:'#5b3fa8',
  fric:'#d23f3f', vel:'#3a4f6e', skyTop:'#cfe7fb', skyBot:'#f3f9ff', ground:'#8fbf5a', groundDark:'#6f9a3f',
  wood:'#c99a5b', woodDark:'#8a6233', crate:'#d8a964', crateDark:'#94672c', white:'#ffffff'
};
const FONT = '"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif';
const MONO = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = x => (x > 0) - (x < 0);
const MINUS = '−';

function fx(x, dp = 1) {            // number -> string with real minus sign
  if (!isFinite(x)) return '—';
  let s = Math.abs(x) < 0.5 * Math.pow(10, -dp) ? (0).toFixed(dp) : x.toFixed(dp);
  if (s.startsWith('-')) s = MINUS + s.slice(1);
  return s;
}
function fs(x, dp = 1) { return (x > 0.5 * Math.pow(10, -dp) ? '+' : '') + fx(x, dp); }   // signed

  [footA, footB].forEach(f => { const [x, y] = P(f[0] + 0.06, f[1]); rr(ctx, x - V.L(0.13), y - V.L(0.07), V.L(0.26), V.L(0.08), V.L(0.03)); ctx.fill(); });

  define(screenId, list) {

    list.forEach((q, i) => { q.screen = screenId; q.n = i + 1; this.all[q.id] = q; });
  },
  init() {
    const saved = Store.load();
    if (saved && saved.seed) { this.seed = saved.seed; this.st = saved.st || {}; App.name = saved.name || ''; }
    else { this.seed = (Math.random() * 1e9) >>> 0; this.persist(); }
  },
  persist() { Store.save({ seed: this.seed, st: this.st, name: App.name, v: 1 }); },
  setCode() { return (this.seed % 46656).toString(36).toUpperCase().padStart(3, '0'); },

      ctx.setLineDash([5, 4]); ctx.strokeStyle = COL.amber; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(V.X(x - 1.2), V.Y(p.h)); ctx.lineTo(V.X(x + 1.2), V.Y(p.h)); ctx.stroke();

      label(ctx, 'Motor ' + k, V.X(x), V.Y(p.h + 1.5), { align: 'center', size: 12.5, color: '#fff', halo: false });
      // cable + crate
      ctx.strokeStyle = '#3a475b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(V.X(x), V.Y(p.h + 1.1)); ctx.lineTo(V.X(x), V.Y(I.y + 1.2)); ctx.stroke();
      drawCrate(ctx, V, x - 0.6, I.y, 1.2, 1.2, fx(I.m, 0) + ' kg');

      drawGraph(ctx, { x: 0, y: 0, w: S.w, h: S.h }, { title: 'Work vs. time (slope = power)', xlabel: 'time (s)', ylabel: 'work done (J)', xmin: 0, xmax: tmax, ymin: 0, ymax: niceCeil(Math.max(A.W, B.W) * 1.08),

const J = v => fx(v, Math.abs(v - Math.round(v)) < 1e-9 ? 0 : (Math.abs(v * 10 - Math.round(v * 10)) < 1e-9 ? 1 : 2));
function fxGraphSVG(p) {
  // force-position graph for Q w5
  const W = 320, H = 170, x0 = 42, x1 = 304, y0 = 140, y1 = 16;
  const xmax = p.x2, ymax = 60;
  const X = v => x0 + v / xmax * (x1 - x0), Y = v => y0 - v / ymax * (y0 - y1);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Force versus position graph"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for (let v = 0; v <= ymax; v += 10) g += `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3e9f1"/><text x="${x0 - 6}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="#4f5c6f" font-family="IBM Plex Mono, monospace">${v}</text>`;
  for (let v = 0; v <= xmax; v += 1) g += `<line y1="${y0}" y2="${y1}" x1="${X(v)}" x2="${X(v)}" stroke="#e3e9f1"/><text x="${X(v)}" y="${y0 + 14}" font-size="10" text-anchor="middle" fill="#4f5c6f" font-family="IBM Plex Mono, monospace">${v}</text>`;
  g += `<path d="M${X(0)},${Y(0)} L${X(0)},${Y(p.F1)} L${X(p.x1)},${Y(p.F1)} L${X(p.x1)},${Y(p.F2)} L${X(p.x2)},${Y(p.F2)} L${X(p.x2)},${Y(0)} Z" fill="rgba(224,138,0,.25)"/>`;
  g += `<path d="M${X(0)},${Y(p.F1)} L${X(p.x1)},${Y(p.F1)} L${X(p.x1)},${Y(p.F2)} L${X(p.x2)},${Y(p.F2)}" fill="none" stroke="#e08a00" stroke-width="3"/>`;
  g += `<line x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}" stroke="#16202d" stroke-width="1.4"/><line x1="${x0}" x2="${x0}" y1="${y0}" y2="${y1}" stroke="#16202d" stroke-width="1.4"/>`;
  g += `<text x="${(x0 + x1) / 2}" y="${H - 2}" font-size="11" text-anchor="middle" fill="#4f5c6f" font-family="IBM Plex Sans, sans-serif">position x (m)</text>`;
  g += `<text x="12" y="${(y0 + y1) / 2}" font-size="11" text-anchor="middle" fill="#4f5c6f" transform="rotate(-90 12 ${(y0 + y1) / 2})" font-family="IBM Plex Sans, sans-serif">force (N)</text></svg>`;
  return g;
}

Q.define('friction', [
  { id: 'f1', group: 'floor', type: 'num', kind: 'sim', unit: 'J',

App.updateProgress = function () {
  App.screens.forEach(s => {
    const t = Q.screenStats(s.id);
    const dot = document.querySelector('.pdot[data-p="' + s.id + '"]');
    if (dot) dot.className = 'pdot' + (t.done === t.n ? ' full' : t.done ? ' part' : '');
    const bar = document.querySelector('[data-bar="' + s.id + '"]'); if (bar) bar.style.width = (t.done / t.n * 100) + '%';
    const cnt = document.querySelector('[data-cnt="' + s.id + '"]'); if (cnt) cnt.textContent = t.done + '/' + t.n + ' questions · ' + t.pts + ' pts';
  });
  const T = Q.totals();
  const ts = document.getElementById('topscore'); if (ts) ts.textContent = T.core.pts + '/' + T.core.max;
};

function resultsText() {
  const T = Q.totals(), now = new Date();
  const lines = ['Work & Energy Lab (Unit 3) — results', 'Name: ' + (App.name || '(no name entered)'), 'Date: ' + now.toLocaleString(), 'Question set: ' + Q.setCode(), ''];
  App.screens.forEach(s => {
    const t = Q.screenStats(s.id);
    lines.push((s.ext ? '[Extension] ' : '') + s.section + ' ' + s.title + ': ' + t.pts + '/' + t.max + ' pts (' + t.done + '/' + t.n + ' done; first try ' + t.first + ', after retry ' + t.later + ', solution shown ' + t.shown + ')');
  });
  lines.push('', 'Core score: ' + T.core.pts + ' / ' + T.core.max + ' (' + Math.round(T.core.pts / T.core.max * 100) + '%)');
  lines.push('Extension (Power): ' + T.ext.pts + ' / ' + T.ext.max);
  return lines.join('\n');
}
function openResults() {
  const T = Q.totals();
  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'My results' });
  const close = () => { modal.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  const nameIn = el('input', { type: 'text', id: 'res-name', value: App.name, placeholder: 'First and last name', style: 'flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px' });
  const ta = el('textarea', { class: 'copyarea', readonly: true, 'aria-label': 'Results summary' });
  const refresh = () => { ta.value = resultsText(); };
  nameIn.addEventListener('input', () => { App.name = nameIn.value.trim(); const hn = document.getElementById('student-name'); if (hn) hn.value = App.name; Q.persist(); refresh(); });
  const tb = el('tbody');
  App.screens.forEach(s => { const t = Q.screenStats(s.id); tb.append(el('tr', null, el('td', null, s.section + ' ' + s.title + (s.ext ? ' (Ext.)' : '')), el('td', null, t.done + ' / ' + t.n), el('td', null, String(t.first)), el('td', null, String(t.later)), el('td', null, String(t.shown)), el('td', null, t.pts + ' / ' + t.max))); });
  const tbl = el('table', { class: 'restable' }, el('thead', null, el('tr', null, ['Screen', 'Done', 'First try', 'Retry', 'Shown', 'Points'].map(h => el('th', null, h)))), tb,
    el('tfoot', null, el('tr', null, el('td', null, 'Core total (3.1–3.5)'), el('td', null, T.core.done + ' / ' + T.core.n), el('td'), el('td'), el('td'), el('td', null, T.core.pts + ' / ' + T.core.max))));
  const copyBtn = el('button', { type: 'button', class: 'btn solid', onclick: () => {
    refresh();
    const done = () => toast('Copied. Paste it where your teacher asked.');
    const fallback = () => { ta.focus(); ta.select(); toast('Press Ctrl+C (or ⌘+C) to copy the selected text.'); };
    try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (e) { fallback(); }
  } }, 'Copy my results');
  let armed = false;
  const resetBtn = el('button', { type: 'button', class: 'linkbtn', onclick: () => {
    if (!armed) { armed = true; resetBtn.textContent = 'Click again to erase all answers on this computer'; setTimeout(() => { armed = false; resetBtn.textContent = 'Start over'; }, 4000); return; }
    Q.st = {}; Q.seed = (Math.random() * 1e9) >>> 0; Q.persist(); location.reload();
  } }, 'Start over');
  refresh();
  modal.append(el('div', { class: 'sheet' },
    el('div', { style: 'display:flex;align-items:center;gap:10px' }, el('h2', null, 'My results'), el('button', { type: 'button', class: 'x', 'aria-label': 'Close', onclick: close }, '×')),
    el('div', { class: 'namebox', style: 'margin:0' }, el('label', { for: 'res-name' }, 'Name'), nameIn),
    el('div', { class: 'bigscore' }, el('b', null, T.core.pts + ' / ' + T.core.max), el('span', null, Math.round(T.core.pts / T.core.max * 100) + '% on sections 3.1–3.5 · Extension: ' + T.ext.pts + ' / ' + T.ext.max)),
    el('div', { style: 'overflow-x:auto' }, tbl),
    el('p', { class: 'note', style: 'font-size:13.5px' }, 'Copy this summary and paste it where your teacher asked (for example, in your assignment). Your answers are saved only in this browser.'),
    ta, el('div', { class: 'qbtns' }, copyBtn, resetBtn)));
  document.body.append(modal);
  copyBtn.focus();
}

function start() {
  Q.init();
  buildShell();
  App.screens.forEach(s => App.buildScreen(s));
  App.updateProgress();
  const h = (location.hash || '').replace('#', '');
  App.go(App.byId[h] ? h : 'home');
  ['input', 'click', 'keydown', 'pointerdown', 'pointermove'].forEach(t => document.addEventListener(t, () => { App.dirty = true; }, { passive: true }));
  window.addEventListener('hashchange', () => { const k = location.hash.replace('#', ''); if (k !== App.current && (App.byId[k] || k === 'home')) App.go(k); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { App.dirty = true; });
  requestAnimationFrame(App.loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

</script>
</body>
